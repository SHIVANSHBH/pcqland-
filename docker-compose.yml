version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file: ./frontend/api/backend/.env
    volumes:
      - ./frontend/api/backend/data:/app/data
      - ./frontend/api/backend/uploads:/app/uploads
      - ./frontend/api/backend/invoices:/app/invoices
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run build && npm start"
    ports:
      - "3000:3000"
    env_file: ./frontend/.env
    volumes:
      - ./frontend:/app
    depends_on:
      - backend
    restart: unless-stopped
