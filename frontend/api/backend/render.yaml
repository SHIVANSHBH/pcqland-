services:
  - type: web
    name: pcdeals-backend
    env: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://pcqland.vercel.app
      - key: BACKEND_URL
        value: https://pcdeals-backend.onrender.com
      # Auth removed — site is public
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: WHATSAPP_API_URL
        sync: false
      - key: WHATSAPP_API_KEY
        sync: false
      - key: WHATSAPP_PHONE_NUMBER
        sync: false
      # Auth removed — site is public
      - key: GSTIN
        sync: false
      - key: GST_PERCENTAGE
        value: "18"
      - key: SHOP_NAME
        value: PC Deals India
      - key: TAX_RATE
        value: "0.18"
